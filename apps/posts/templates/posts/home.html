{% extends 'base.html' %}

{% block title %}Home - Life Journal{% endblock %}

{% block content %}
<div class="home-container">
    <div class="welcome-section">
        <h1>Welcome to Life Journal</h1>
        <p class="subtitle">Share your moments, tell your story</p>
        
        {% if user.is_authenticated %}
            <div class="user-welcome">
                <p>Hello, <strong>{{ user.username }}</strong>!</p>
                <a href="{% url 'account_logout' %}" class="btn btn-secondary">Logout</a>
            </div>
        {% else %}
            <div class="auth-actions">
                <a href="{% url 'account_signup' %}" class="btn btn-primary">Get Started</a>
                <a href="{% url 'account_login' %}" class="btn btn-outline">Login</a>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
